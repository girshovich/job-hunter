      - generic [ref=e15]:
        - heading "Terms of Service" [level=1] [ref=e16]
        - paragraph [ref=e17]: "Effective date: July 13, 2026"
      - paragraph [ref=e18]: These terms govern your use of Job Hunter. By creating an account or using the service in any mode, you agree to them. If you do not agree, please do not use the service.
      - generic [ref=e19]:
        - heading "1. Who operates this service" [level=2] [ref=e20]
        - paragraph [ref=e21]:
          - text: Job Hunter is operated by
          - strong [ref=e22]: Mikhail Girshovich
          - text: ", an individual based in Armenia. This is a personal project, not a corporate product."
      - generic [ref=e23]:
        - heading "2. Eligibility" [level=2] [ref=e24]
        - paragraph [ref=e25]: You must be at least 18 years old to use Job Hunter. By using the service, you confirm that you meet this requirement.
      - generic [ref=e26]:
        - heading "3. What the service does" [level=2] [ref=e27]
        - paragraph [ref=e28]: Job Hunter fetches job postings from third-party sources, scores them against your profile using AI, removes duplicates, sends a digest email, and gives you a dashboard to review, track, and apply to jobs. It does not apply to jobs on your behalf, guarantee interview invitations, or act as a recruiter or job board.
      - generic [ref=e29]:
        - heading "4. Usage modes" [level=2] [ref=e30]
        - list [ref=e31]:
          - listitem [ref=e32]:
            - strong [ref=e33]: Buy credits
            - text: — use Job Hunter's hosted infrastructure. Source API costs, AI scoring, deduplication, and email delivery costs are covered by a prepaid credit balance you purchase through Hipolink (see Section 5). A 10% service fee applies on top of underlying costs.
          - listitem [ref=e34]:
            - strong [ref=e35]: Bring your own keys (BYOK)
            - text: — use the app for free by connecting your own OpenAI, Apify, or similar API keys. No credit purchase is required; you pay your providers directly.
          - listitem [ref=e36]:
            - strong [ref=e37]: Self-hosted
            - text: — run the open-source code from GitHub for personal, non-commercial use. You are responsible for your own infrastructure, security, and provider keys.
      - generic [ref=e38]:
        - heading "5. Credits and payments (hosted mode)" [level=2] [ref=e39]
        - paragraph [ref=e40]:
          - strong [ref=e41]: What credits are.
          - text: Credits are a prepaid usage balance. They cover the cost of AI processing, job scraping, and email delivery on the hosted service, plus a 10% service fee. Credits have no cash value, are non-transferable, and are tied to your account.
        - paragraph [ref=e42]:
          - strong [ref=e43]: Hipolink as payment provider.
          - text: Credits are sold by Mikhail Girshovich. Payments are processed by
          - strong [ref=e44]: Hipolink
          - text: ", which handles checkout, payment processing, and receipts. Checkout takes place on Hipolink's secure payment page; you do not enter card details into Job Hunter. Hipolink's"
          - link "privacy policy" [ref=e45] [cursor=pointer]:
            - /url: https://hipolink.net/en/app/privacy-policy
          - text: applies to the payment data you provide there.
        - paragraph [ref=e46]:
          - strong [ref=e47]: Credits are not refundable.
          - text: All credit purchases are final. Credits are not refundable, whether used or unused, and unused credits are forfeited if your account is closed by you or terminated for cause.
        - paragraph [ref=e48]:
          - strong [ref=e49]: Availability note.
          - text: Hosted credit purchasing is planned but not yet available. These payment terms will take effect once the feature launches.
      - generic [ref=e50]:
        - heading "6. No guarantees" [level=2] [ref=e51]
        - list [ref=e52]:
          - listitem [ref=e53]: Job listings may be inaccurate, outdated, or no longer available by the time you see them.
          - listitem [ref=e54]: AI scores may be incomplete or wrong (but I try my best for them not to be).
          - listitem [ref=e55]: The service does not guarantee interviews, responses, or job offers.
          - listitem [ref=e56]: Uptime and pipeline availability are not guaranteed.
      - generic [ref=e57]:
        - heading "7. Your responsibilities" [level=2] [ref=e58]
        - list [ref=e59]:
          - listitem [ref=e60]: Provide accurate account information and keep it up to date.
          - listitem [ref=e61]: Only upload content (such as a CV) that you have the right to use.
          - listitem [ref=e62]: Do not abuse or circumvent provider APIs, scraping rate limits, or service controls.
          - listitem [ref=e63]: Keep your login credentials and any API keys you enter in settings secure.
          - listitem [ref=e64]: Do not attempt to bypass billing, credits, or access controls.
          - listitem [ref=e65]: Do not resell or sublicense hosted access to others.
          - listitem [ref=e66]: Do not use the self-hosted code for commercial purposes.
      - generic [ref=e67]:
        - heading "8. AI output" [level=2] [ref=e68]
        - paragraph [ref=e69]: AI-generated scores, summaries, and CV comparisons are automated and may be incorrect. You are responsible for any decisions you make based on them.
      - generic [ref=e70]:
        - heading "9. Third-party services" [level=2] [ref=e71]
        - paragraph [ref=e72]: Job Hunter relies on third-party providers to operate. These can include Hipolink (payment processing for credit purchases), OpenAI or Anthropic (AI), Apify and other scraping providers (job collection), Resend (email delivery), and job sources such as LinkedIn, Indeed, StepStone, Greenhouse, Ashby, and Lever. Each provider's own terms and privacy policies apply to their part of the service.
      - generic [ref=e73]:
        - heading "10. Suspension and termination" [level=2] [ref=e74]
        - paragraph [ref=e75]: Access may be suspended or terminated for misuse, non-payment, confirmed fraud, or unresolved chargebacks. Unused credits are forfeited upon termination for cause. You may close your account at any time by contacting support.
      - generic [ref=e76]:
        - heading "11. Liability" [level=2] [ref=e77]
        - paragraph [ref=e78]: The service is provided "as is" without warranties of any kind. To the maximum extent permitted by applicable law, total liability is limited to the amount you paid for hosted credits in the most recent purchase.
      - generic [ref=e79]:
        - heading "12. Governing law" [level=2] [ref=e80]
        - paragraph [ref=e81]: These terms are governed by the laws of the Republic of Armenia. For payment disputes involving Hipolink transactions, Hipolink's own dispute and resolution procedures also apply.
      - generic [ref=e82]:
        - heading "13. Changes to these terms" [level=2] [ref=e83]
        - paragraph [ref=e84]: These terms may be updated from time to time. Changes are published on this page with a new effective date. Continued use after a change constitutes acceptance of the updated terms.
