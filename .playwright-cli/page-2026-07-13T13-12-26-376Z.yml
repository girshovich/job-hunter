        - heading "Refund Policy" [level=1] [ref=e16]
        - paragraph [ref=e17]: "Effective date: July 13, 2026"
      - generic [ref=e18]:
        - paragraph [ref=e19]: Deprecated since 13.07.2026
        - paragraph [ref=e20]:
          - text: This policy is no longer in effect. Credits are not refundable — see the
          - link "Terms of Service" [ref=e21] [cursor=pointer]:
            - /url: /terms
          - text: .
      - paragraph [ref=e22]: This policy covers refunds for hosted credit purchases processed through PayPro Global. Bring-your-own-key and self-hosted modes don't involve hosted charges and are not covered here.
      - generic [ref=e23]:
        - heading "1. Eligibility" [level=2] [ref=e24]
        - paragraph [ref=e25]: "You may request a refund of your remaining unused credit balance if both conditions are met:"
        - list [ref=e26]:
          - listitem [ref=e27]: Your unused credit balance is at least $5.00 at the time of the request.
          - listitem [ref=e28]: Your request is submitted within 14 days of the original purchase date.
        - paragraph [ref=e29]: Requests that don't meet both conditions are not eligible.
      - generic [ref=e30]:
        - heading "2. What is not refundable" [level=2] [ref=e31]
        - list [ref=e32]:
          - listitem [ref=e33]: Credits already consumed by AI scoring, job scraping, email delivery, or other provider operations.
          - listitem [ref=e34]: The 10% service fee on consumed credits.
          - listitem [ref=e35]: PayPro Global's original payment processing fees on your transaction.
          - listitem [ref=e36]: Unused credit balances below $5.00.
      - generic [ref=e37]:
        - heading "3. How usage is counted" [level=2] [ref=e38]
        - paragraph [ref=e39]: Credits are deducted when provider costs are incurred — when a job run executes, AI scoring happens, or emails are sent. This applies even if results were poor, listings were stale, or AI scores weren't what you expected. Credits pay for computational work, not for job-search outcomes.
      - generic [ref=e40]:
        - heading "4. No outcome-based refunds" [level=2] [ref=e41]
        - paragraph [ref=e42]: No refunds are issued because AI scores felt wrong, no interviews resulted from your search, or third-party job data was inaccurate or expired.
      - generic [ref=e43]:
        - heading "5. How refunds are processed" [level=2] [ref=e44]
        - paragraph [ref=e45]:
          - text: All hosted credit purchases are made through
          - strong [ref=e46]: PayPro Global
          - text: ", which acts as Merchant of Record. Approved refunds are issued through PayPro Global and typically take 5–10 business days to appear, depending on your payment provider."
      - generic [ref=e47]:
        - heading "6. Billing errors" [level=2] [ref=e48]
        - paragraph [ref=e49]: If a charge was made in error — duplicate payment or a confirmed technical fault — the full incorrect amount will be refunded through PayPro Global. The 14-day window and $5 minimum do not apply to billing errors.
      - generic [ref=e50]:
        - heading "7. Chargebacks" [level=2] [ref=e51]
        - paragraph [ref=e52]: Because PayPro Global is the Merchant of Record, payment disputes and chargebacks go through PayPro Global's dispute process. Hosted service access may be suspended while a chargeback is under review.
      - generic [ref=e53]:
        - heading "8. BYOK and self-hosted" [level=2] [ref=e54]
        - paragraph [ref=e55]: Bring-your-own-key and self-hosted modes don't involve hosted credit purchases. Any charges from third-party providers you connect (OpenAI, Apify, Resend, etc.) are between you and those providers directly.
      - generic [ref=e56]:
        - heading "9. Donations" [level=2] [ref=e57]
        - paragraph [ref=e58]: Donations through Ko-fi, Buy Me a Coffee, or GitHub Sponsors are voluntary and non-refundable, except for confirmed accidental or duplicate transactions, which are handled by those platforms directly.
      - generic [ref=e59]:
        - heading "10. How to request a refund" [level=2] [ref=e60]
        - paragraph [ref=e61]:
          - text: Email
          - link "mikhail@girshovich.me" [ref=e62] [cursor=pointer]:
            - /url: mailto:mikhail@girshovich.me
          - text: with your PayPro Global order ID, account email, and reason for the request. I'll respond within 3 business days.