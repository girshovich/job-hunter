      - generic [ref=e44]:
        - heading "Credits" [level=2] [ref=e45]
        - paragraph [ref=e46]: Credits are a prepaid usage balance tied to your account. They have no cash value, are non-transferable, and cannot be shared between accounts. Credits are consumed when provider costs are incurred — when a job run executes, AI scoring happens, or emails are sent — regardless of the quality of results.
        - paragraph [ref=e47]: Cost varies by the number and type of job sources used, roles and locations scored, AI model selected, and volume of matching jobs on the market. First use over a longer period fetches more results than daily updates, so costs more.
